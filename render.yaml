services:
  - type: web
    name: gestion-centro-jubilados
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PORTAL_BUCKET
        value: portal-media
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

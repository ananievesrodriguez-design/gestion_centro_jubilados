{% extends "base.html" %}

{% block title %}Editar Comisión Directiva - {{ INSTITUCION.nombre or 'Centro de Jubilados' }}{% endblock %}

{% block content %}
<div class="py-4" style="max-width: min(760px, 100%);">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold text-primary mb-0">Editar integrante</h4>
        <a class="btn btn-outline-secondary" href="{{ url_for('admin.comision_directiva') }}">Volver</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold" for="socioComision">Socio activo</label>
                    <select class="form-select" id="socioComision" name="socio_id" required>
                        <option value="" disabled {% if not socio_activo_actual %}selected{% endif %}>
                            Seleccioná un socio activo
                        </option>
                        {% for socio in socios_activos %}
                        <option value="{{ socio.id }}" {% if socio.id == integrante.socio_id %}selected{% endif %}>
                            {% if socio.nro_socio %}N° {{ socio.nro_socio }} · {% endif %}
                            {{ socio.apellido }}, {{ socio.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="cargoComision">Cargo</label>
                    <select class="form-select" id="cargoComision" name="cargo" required>
                        {% for cargo in cargos_comision %}
                        <option value="{{ cargo }}" {% if cargo == integrante.cargo %}selected{% endif %}>
                            {{ cargo }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label class="form-label fw-bold" for="inicioComision">Fecha de inicio</label>
                        <input type="date" class="form-control" id="inicioComision" name="fecha_inicio"
                               value="{{ integrante.fecha_inicio.isoformat() }}" required>
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label class="form-label fw-bold" for="finComision">Fecha de finalización</label>
                        <input type="date" class="form-control" id="finComision" name="fecha_fin"
                               value="{{ integrante.fecha_fin.isoformat() if integrante.fecha_fin else '' }}">
                        <div class="form-text">Dejar vacía si todavía no finalizó.</div>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-secondary" href="{{ url_for('admin.comision_directiva') }}">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

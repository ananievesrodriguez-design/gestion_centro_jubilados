{% extends "base.html" %}

{% block title %}Editar Socio - {{ socio.apellido }}, {{ socio.nombre }}{% endblock %}

{% block content %}
    <div class="container py-4" style="max-width: 760px;">
        <div class="card card-amigable shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="fw-bold mb-0 text-primary">Editar Ficha de Socio</h4>
                    <small class="text-muted">Modificación de datos institucionales y de contacto</small>
                </div>
                <a href="{{ url_for('ficha_socio', id=socio.id) }}" class="btn btn-outline-info btn-sm">
                    📇 Ver Historial Completo
                </a>
            </div>

            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">N° Socio</label>
                            <input type="number" class="form-control" name="nro_socio" value="{{ socio.nro_socio or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">DNI</label>
                            <input type="text" class="form-control" name="dni" value="{{ socio.dni or '' }}">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-bold">Estado</label>
                            <select name="estado" class="form-select">
                                <option value="Activo" {% if (socio.estado or '')|lower == 'activo' %}selected{% endif %}>Activo</option>
                                <option value="Inactivo" {% if (socio.estado or '')|lower == 'inactivo' %}selected{% endif %}>Inactivo</option>
                                <option value="Vitalicio" {% if (socio.estado or '')|lower == 'vitalicio' %}selected{% endif %}>Vitalicio</option>
                                <option value="Baja" {% if (socio.estado or '')|lower == 'baja' %}selected{% endif %}>Baja</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Apellido</label>
                            <input type="text" class="form-control" name="apellido" value="{{ socio.apellido }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control" name="nombre" value="{{ socio.nombre }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Teléfono / Celular</label>
                            <input type="text" class="form-control" name="telefono" value="{{ socio.telefono or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control" name="email" value="{{ socio.email or '' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Dirección / Domicilio</label>
                            <input type="text" class="form-control" name="direccion" value="{{ socio.direccion or '' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Observaciones</label>
                            <textarea class="form-control" name="observaciones" rows="3">{{ socio.observaciones or '' }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('matriz_cuotas') }}" class="btn btn-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary fw-bold px-4">💾 Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

{% endblock %}

{% extends "base.html" %}

{% block title %}Iniciar Sesión - {{ INSTITUCION.nombre or 'Centro de Jubilados' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 fw-bold">🔐 Iniciar Sesión</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="identifier" class="form-label fw-bold">Correo o nombre de usuario (*)</label>
                        <input type="text" class="form-control" id="identifier" name="identifier" autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Contraseña (*)</label>
                        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary fw-bold">Ingresar</button>
                    </div>
                </form>
                <p class="text-center text-muted small mt-3 mb-0">
                    ¿Necesitás acceso? Pedile a una persona administradora que te cree un usuario y una clave.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

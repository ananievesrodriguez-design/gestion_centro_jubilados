{% extends "base.html" %}

{% block title %}Enviar novedad - {{ INSTITUCION.nombre or 'Centro de Jubilados' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 fw-bold">Enviar una novedad</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">
                    La administración revisará el mensaje antes de publicarlo para los socios.
                </p>
                <form method="POST" action="{{ url_for('admin.enviar_novedad_cobrador') }}">
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-bold">Título (*)</label>
                        <input type="text" class="form-control" id="titulo" name="titulo"
                               maxlength="200" required>
                    </div>
                    <div class="mb-3">
                        <label for="contenido" class="form-label fw-bold">Mensaje (*)</label>
                        <textarea class="form-control" id="contenido" name="contenido"
                                  rows="5" maxlength="10000" required></textarea>
                    </div>
                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <button type="submit" class="btn btn-primary flex-fill py-2 fw-bold">Enviar a revisión</button>
                        <a href="{{ url_for('socios.inicio_cobrador') }}"
                           class="btn btn-outline-secondary flex-fill py-2">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Nuevo Movimiento - {{ INSTITUCION.nombre or 'Centro de Jubilados' }}{% endblock %}

{% block content %}
    <div class="container py-4" style="max-width: 680px;">
        <div class="card card-amigable shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 text-center">Asentar Movimiento en Caja</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row">
                        <!-- Tipo: Ingreso / Egreso -->
                        <div class="col-md-6 mb-3">
                            <label for="tipo" class="form-label fw-bold">Tipo de Operación (*)</label>
                            <select class="form-select border-primary" id="tipo" name="tipo" required>
                                <option value="Egreso" selected>Egreso (Gasto / Salida)</option>
                                <option value="Ingreso">Ingreso (Entrada de dinero)</option>
                            </select>
                        </div>

                        <!-- Fecha -->
                        <div class="col-md-6 mb-3">
                            <label for="fecha" class="form-label fw-bold">Fecha (*)</label>
                            <input type="date" class="form-control" id="fecha" name="fecha" value="{{ hoy }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Categoría -->
                        <div class="col-md-6 mb-3">
                            <label for="categoria" class="form-label fw-bold">Categoría (*)</label>
                            <select class="form-select" id="categoria" name="categoria" required>
                                <option value="Servicios">Servicios (Luz, Internet, etc.)</option>
                                <option value="Mantenimiento / Refacciones">Mantenimiento / Refacciones</option>
                                <option value="Artículos de Limpieza / Oficina">Artículos de Limpieza / Oficina</option>
                                <option value="Eventos / Agasajos">Eventos / Agasajos</option>
                                <option value="Subsidio / Donación">Subsidio / Donación</option>
                                <option value="Varios">Varios</option>
                            </select>
                        </div>

                        <!-- Monto -->
                        <div class="col-md-6 mb-3">
                            <label for="monto" class="form-label fw-bold">Monto ($) (*)</label>
                            <input type="number" step="0.01" class="form-control fw-bold" id="monto" name="monto" placeholder="0.00" required>
                        </div>
                    </div>

                    <!-- Concepto -->
                    <div class="mb-3">
                        <label for="concepto" class="form-label fw-bold">Concepto / Detalle (*)</label>
                        <input type="text" class="form-control" id="concepto" name="concepto" placeholder="Ej: Pago de factura de luz / Compra de pintura" required>
                    </div>

                    <div class="row">
                        <!-- Comprobante -->
                        <div class="col-md-6 mb-3">
                            <label for="comprobante" class="form-label fw-bold">N° Comprobante / Factura</label>
                            <input type="text" class="form-control" id="comprobante" name="comprobante" placeholder="Ej: F-0001-2345">
                        </div>

                        <!-- Interviene -->
                        <div class="col-md-6 mb-3">
                            <label for="interviene" class="form-label fw-bold">Interviene (Persona a cargo)</label>
                            <input type="text" class="form-control" id="interviene" name="interviene" placeholder="Quién abona, compra o entrega">
                        </div>
                    </div>

                    <!-- Método -->
                    <div class="mb-3">
                        <label for="metodo" class="form-label fw-bold">Método de Pago</label>
                        <select class="form-select" id="metodo" name="metodo">
                            <option value="Efectivo" selected>Efectivo</option>
                            <option value="Transferencia">Transferencia Bancaria</option>
                        </select>
                    </div>

                    <!-- Observaciones -->
                    <div class="mb-3">
                        <label for="observaciones" class="form-label fw-bold">Observaciones</label>
                        <textarea class="form-control" id="observaciones" name="observaciones" rows="2" placeholder="Aclaraciones opcionales..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Guardar Movimiento</button>
                </form>
            </div>
        </div>
    </div>

{% endblock %}

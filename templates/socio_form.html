<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Editar' if socio else 'Nuevo' }} Socio - Centro de Jubilados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">

</head>
<body class="bg-light">
{% include 'navbar.html' %}

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold">Centro de Jubilados</span>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="{{ url_for('listar_socios') }}">← Volver al Padrón</a>
        </div>
    </div>
</nav>

<div class="container py-3" style="max-width: 800px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fw-bold">{{ '✏️ Modificar Ficha de Socio' if socio else '➕ Registrar Nuevo Socio' }}</h4>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">N° de Socio</label>
                        <input type="text" class="form-control bg-light" value="Automático (asignado por sistema)" readonly>
                        <small class="text-muted">Se asignará con el ID correlativo.</small>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">DNI (*)</label>
                        <input type="text" class="form-control" name="dni" value="{{ socio.dni if socio else '' }}" required placeholder="Sin puntos">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Estado</label>
                        <select name="estado" class="form-select">
                            <option value="Activo" selected>Activo</option>
                            <option value="Vitalicio">Vitalicio</option>
                            <option value="Baja">Baja</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Apellido (*)</label>
                        <input type="text" class="form-control text-uppercase" name="apellido" value="{{ socio.apellido if socio else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre (*)</label>
                        <input type="text" class="form-control" name="nombre" value="{{ socio.nombre if socio else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" name="fecha_nacimiento" value="{{ socio.fecha_nacimiento.strftime('%Y-%m-%d') if socio and socio.fecha_nacimiento else '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Fecha de Ingreso al Centro</label>
                        <input type="date" class="form-control" name="fecha_ingreso" value="{{ socio.fecha_ingreso.strftime('%Y-%m-%d') if socio and socio.fecha_ingreso else '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Teléfono / Celular</label>
                        <input type="text" class="form-control" name="telefono" value="{{ socio.telefono if socio else '' }}" placeholder="Ej: 383-4xxxxxx">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Correo Electrónico</label>
                        <input type="email" class="form-control" name="email" value="{{ socio.email if socio else '' }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">Dirección / Localidad</label>
                        <input type="text" class="form-control" name="direccion" value="{{ socio.direccion if socio else '' }}" placeholder="Barrio, calle, paraje...">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">Observaciones</label>
                        <textarea class="form-control" name="observaciones" rows="2">{{ socio.observaciones if socio else '' }}</textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="{{ url_for('listar_socios') }}" class="btn btn-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Guardar Socio</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
